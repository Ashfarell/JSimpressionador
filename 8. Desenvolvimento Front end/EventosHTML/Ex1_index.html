<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="EX1_style.css" />
    <title>Document</title>
  </head>
  <body>
    <h2>Eventos em elementos HTML</h2>

    <!--Exercício 1: Mudança de cor ao passar o mouse sobre um elemento-->
    <p>Passe o mouse aqui para mudar a cor do texto.</p>
    <!--Muda todos os <p>-->

    <p class="teste1">Muda apenas essa cor1</p>
    <!--hover + class-->

    <p id="teste2">Muda apenas essa cor 2</p>
    <!--hover + id-->

    <p onmouseover="this.style.color = 'green'" onmouseout="this.style.color = 'black'">Muda com onmouseover</p>
    <!--Usando direto no HTML-->

    <p id="testeScript" onmouseover="mudarCor()" onmouseout="voltarCor()">Muda apenas essa cor - 2 FUNÇÕES</p>
    <!--Usando 2 FUNÇÕES do script-->

    <p id="testeScript1" onmouseover="mudarEVoltarCor('grey')" onmouseout="mudarEVoltarCor('black')">Muda apenas essa cor -1 FUNÇÃO</p>
    <!--Usando 1 FUNÇÃO do script-->

    <!--FIM Exercício 1-->

    <!--Exercício 2: Exibição de alerta ao clicar em um botão-->

    <button onclick="console.log('Botão clidado!')">Clique aqui 1</button>
    <!--Usando direto no HTML    ERRADO!!!-->

    <button id="testeScript2" onclick="msgNoClick()">Clique aqui 2</button>
    <!--Usando script            ERRADO!!!-->

    <button onclick="alert('Botão clicado!')">Clique aqui 3</button>
    <!--Usando direto no HTML    CERTO-->

    <button id="testeScript3" onclick="msgAlerta()">Clique aqui 4</button>
    <!--Usando script            CERTO!!!-->

    <!--FIM Exercício 2-->

    <!--Exercício 3: Mostrar mensagem ao focar e desfocar um campo de
entrada-->

    <input type="text" placeholder="Digite aqui" />
    <img src="imagem1.png" alt="Imagem misteriosa" />

    <script src="Ex1_script.js"></script>
    <!--Importa script -->
  </body>
</html>
