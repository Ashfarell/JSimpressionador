<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elementos formulário HTML</title>

    <!-- //* ==> TODOS OS ELEMENTOS -->
    <style>
      * {
        margin: 3px;
        padding: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Elementos de um formulário</h1>

    <form>
      <label for="">Texto:</label>
      <input type="text" />

      <br />
      <label for="">Senha:</label>
      <input type="password" />

      <br />
      <label for="Checkbox">Checkbox</label>
      <input type="checkbox" id="checkbox" />

      <br />
      <label for="radio1">Radio1</label>
      <input type="radio" id="radio1" name="radioGroup" />

      <label label for="radio2">Radio2</label>
      <input type="radio" id="radio2" name="radioGroup" />

      <br />
      <label for="file">File-Arquivo</label>
      <input type="file" id="file" />

      <br />
      <label for="email">Email:</label>
      <input type="email" id="email" />

      <br />
      <label for="number">Numero</label>
      <input type="number" id="number" />/

      <br />
      <label for="data">Data:</label>
      <input type="date" id="data" />/

      <br />

      <!-- Opções dentro do Select -->
      <label for="selecione">Selecione</label>
      <select name="GrupoSelect" id="selecione">
        <option value="opcao1">Opção 1</option>
        <option value="opcao2">Opção 2</option>
        <option value="opcao3">Opção 3</option>
      </select>

      <br />
      <label for="textarea">Area do Texto</label>
      <textarea name="textarea" id="textarea" cols="20" rows="10"></textarea>

      <br />
      <label for="">Enviar</label>
      <input type="submit" id="submit" />

      <button type="submit">Enviar</button>

      <br />
      <input type="reset" />
      <button type="reset">Reset</button>

      <br />
      <input type="button" />
    </form>
  </body>
</html>
