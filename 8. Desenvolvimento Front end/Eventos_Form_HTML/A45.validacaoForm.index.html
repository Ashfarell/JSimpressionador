<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A45 Validação form</title>
    <style>
      * {
        margin: 5px;
        padding: 4px;
      }

      .error-message {
        color: red;
        display: none;
      }
    </style>
  </head>

  <form id="meuFormulario">
    <h1>Validação de formulário</h1> 
  
      <br />
      <label for="" id="nome" >Nome:</label>
      <input type="text" id="textoNome" class="obrigatorio" />
      <span class="error-message">Campo obrigatório</span>

      <br />

      <label for="">Senha:</label>
      <input type="password" id="senha" class="obrigatorio" />
      <span class="error-message">Campo obrigatório</span>

      <br />
      <label for="">Confirmar senha:</label>
      <input type="password" id="confirmarSenha" class="obrigatorio" />
      <span class="error-message">Campo obrigatório</span>

      <br />

      <label for="">Email:</label>
      <input type="email" id="email" class="obrigatorio" />
      <span class="error-message">Campo obrigatório</span>

      <br />

      <label for="">Idade:</label>
      <input type="number" id="idade" class="obrigatorio" />
      <span class="error-message">Campo obrigatório</span>

    <br />
    <label for="">Enviar</label>
    <input type="submit" id="enviar" onclick="validarCamposObrigatorios()" />

</form>

    <script src="A45.validacaoForm.script.js"></script>
  </body>
</html>
